name: Build Release

on:
  push:
    branches: [ "master", "feature/macos-support" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dmgbuild
          
      - name: Build DMG
        run: python build.py
        
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DevSpace-macOS
          path: dist/DevSpace.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Build EXE
        run: python build.py
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DevSpace-Windows
          path: dist/DevSpace.exe
